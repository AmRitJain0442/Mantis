    <script>
      // Resolve the theme before first paint so the shell never flashes the wrong one.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("mantis:theme"); } catch (e) {}
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;

        var scale = null;
        try { scale = localStorage.getItem("mantis:scale"); } catch (e) {}
        if (scale && scale !== "1") document.documentElement.style.zoom = scale;
      })();
    </script>
