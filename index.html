<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="description" content="FlowTrace — a shared debugging environment for humans and AI agents." />
    <title>FlowTrace — Agent-native debugging</title>
    <!--
      WebMCP is behind an origin trial in Chrome 149. Register the deployed
      origin at https://developer.chrome.com/origintrials/#/register_trial/4163014905550602241
      and paste the token below to turn tool registration on in production.
      Without it the app runs on its own model-context shim and the status
      chip reads "WebMCP preview".
    -->
    <!-- <meta http-equiv="origin-trial" content="REPLACE_WITH_ORIGIN_TRIAL_TOKEN" /> -->

    <script>
      // Resolve the theme before first paint so the shell never flashes the wrong one.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("flowtrace:theme"); } catch (e) {}
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;

        var scale = null;
        try { scale = localStorage.getItem("flowtrace:scale"); } catch (e) {}
        if (scale && scale !== "1") document.documentElement.style.zoom = scale;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
